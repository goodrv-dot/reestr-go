# Будильник для безкоштовного плану Supabase: раз на день звертається до бази ззовні,
# щоб проєкт не «заснув» навіть якщо внутрішній робот зупиниться.
# Читає лише публічний довідник областей (без персональних даних). Ключ — публічний (той самий, що на сайті).
name: keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: sb_publishable_toshCx7qTQ5KVNatDo69hQ_9Sn8W1pU" \
            "https://pbvlnjcutnehjcqimubz.supabase.co/rest/v1/regions?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
